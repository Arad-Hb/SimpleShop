<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأمین‌کنندگان | پنل مدیریت</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar"><div class="container"><a href="/" class="logo">SimpleShop</a><div class="nav-links"><a href="/admin/">بازگشت</a></div></div></nav>
    <div class="page"><div class="container admin-layout">
        <aside class="admin-sidebar card">
            <a href="/admin/">داشبورد</a>
            <a href="/admin/categories.html">دسته‌بندی‌ها</a>
            <a href="/admin/products.html">محصولات</a>
            <a href="/admin/suppliers.html" class="active">تأمین‌کنندگان</a>
            <a href="/admin/customers.html">مشتریان</a>
            <a href="/admin/orders.html">سفارش‌ها</a>
        </aside>
        <main class="admin-content">
            <h1 class="page-title">مدیریت تأمین‌کنندگان</h1>
            <div id="alert-box" class="alert"></div>
            <div class="card" style="margin-bottom:1.5rem">
                <h3 id="form-title">افزودن تأمین‌کننده</h3>
                <form onsubmit="saveSupplier(event)" style="margin-top:1rem">
                    <input type="hidden" id="sup-id">
                    <div class="form-group"><label>نام</label><input id="sup-name" class="form-control" required></div>
                    <div class="form-group"><label>مسئول</label><input id="sup-contact" class="form-control"></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                        <div class="form-group"><label>تلفن</label><input id="sup-phone" class="form-control"></div>
                        <div class="form-group"><label>ایمیل</label><input id="sup-email" type="email" class="form-control"></div>
                    </div>
                    <div class="form-group"><label>آدرس</label><input id="sup-address" class="form-control"></div>
                    <button type="submit" class="btn btn-primary">ذخیره</button>
                    <button type="button" class="btn btn-outline" onclick="resetForm()">انصراف</button>
                </form>
            </div>
            <div class="card">
                <table><thead><tr><th>نام</th><th>مسئول</th><th>تلفن</th><th>ایمیل</th><th>محصولات</th><th>عملیات</th></tr></thead>
                <tbody id="list"></tbody></table>
            </div>
        </main>
    </div></div>
    <script src="/js/app.js"></script>
    <script>
        let suppliers = [];
        if (!Auth.isAdmin()) location.href = '/login.html';
        document.addEventListener('DOMContentLoaded', loadList);

        async function loadList() {
            suppliers = await api('/suppliers');
            document.getElementById('list').innerHTML = suppliers.map(s => `
                <tr><td>${s.name}</td><td>${s.contactPerson||''}</td><td>${s.phone||''}</td><td>${s.email||''}</td><td>${s.productCount}</td>
                <td><button class="btn btn-sm btn-outline" onclick="edit(${s.id})">ویرایش</button>
                <button class="btn btn-sm btn-danger" onclick="del(${s.id})">حذف</button></td></tr>`).join('');
        }

        function edit(id) {
            const s = suppliers.find(x => x.id === id);
            document.getElementById('sup-id').value = s.id;
            document.getElementById('sup-name').value = s.name;
            document.getElementById('sup-contact').value = s.contactPerson || '';
            document.getElementById('sup-phone').value = s.phone || '';
            document.getElementById('sup-email').value = s.email || '';
            document.getElementById('sup-address').value = s.address || '';
            document.getElementById('form-title').textContent = 'ویرایش تأمین‌کننده';
        }

        function resetForm() {
            ['sup-id','sup-name','sup-contact','sup-phone','sup-email','sup-address'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('form-title').textContent = 'افزودن تأمین‌کننده';
        }

        async function saveSupplier(e) {
            e.preventDefault();
            const id = document.getElementById('sup-id').value;
            const body = {
                name: document.getElementById('sup-name').value,
                contactPerson: document.getElementById('sup-contact').value,
                phone: document.getElementById('sup-phone').value,
                email: document.getElementById('sup-email').value,
                address: document.getElementById('sup-address').value
            };
            try {
                if (id) await api(`/suppliers/${id}`, { method: 'PUT', body: JSON.stringify(body) });
                else await api('/suppliers', { method: 'POST', body: JSON.stringify(body) });
                resetForm(); loadList(); showAlert('ذخیره شد.', 'success');
            } catch (err) { showAlert(err.message, 'danger'); }
        }

        async function del(id) {
            if (!confirm('حذف شود؟')) return;
            await api(`/suppliers/${id}`, { method: 'DELETE' });
            loadList();
        }
    </script>
</body>
</html>
