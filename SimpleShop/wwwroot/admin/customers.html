<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشتریان | پنل مدیریت</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar"><div class="container"><a href="/" class="logo">SimpleShop</a><div class="nav-links"><a href="/admin/">بازگشت</a></div></div></nav>
    <div class="page"><div class="container admin-layout">
        <aside class="admin-sidebar card">
            <a href="/admin/">داشبورد</a>
            <a href="/admin/categories.html">دسته‌بندی‌ها</a>
            <a href="/admin/products.html">محصولات</a>
            <a href="/admin/suppliers.html">تأمین‌کنندگان</a>
            <a href="/admin/customers.html" class="active">مشتریان</a>
            <a href="/admin/orders.html">سفارش‌ها</a>
        </aside>
        <main class="admin-content">
            <h1 class="page-title">مدیریت مشتریان</h1>
            <div class="card">
                <table><thead><tr><th>نام</th><th>نام کاربری</th><th>ایمیل</th><th>تلفن</th><th>سفارش‌ها</th><th>تاریخ عضویت</th></tr></thead>
                <tbody id="list"></tbody></table>
            </div>
        </main>
    </div></div>
    <script src="/js/app.js"></script>
    <script>
        if (!Auth.isAdmin()) location.href = '/login.html';
        document.addEventListener('DOMContentLoaded', async () => {
            const items = await api('/customers');
            document.getElementById('list').innerHTML = items.map(c => `
                <tr><td>${c.fullName}</td><td>${c.username}</td><td>${c.email}</td><td>${c.phone||''}</td><td>${c.orderCount}</td><td>${formatDate(c.createdAt)}</td></tr>`).join('');
        });
    </script>
</body>
</html>
