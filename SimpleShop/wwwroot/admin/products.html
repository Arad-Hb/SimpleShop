<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات | پنل مدیریت</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar"><div class="container"><a href="/" class="logo">SimpleShop</a><div class="nav-links"><a href="/admin/">بازگشت</a></div></div></nav>
    <div class="page"><div class="container admin-layout">
        <aside class="admin-sidebar card">
            <a href="/admin/">داشبورد</a>
            <a href="/admin/categories.html">دسته‌بندی‌ها</a>
            <a href="/admin/products.html" class="active">محصولات</a>
            <a href="/admin/suppliers.html">تأمین‌کنندگان</a>
            <a href="/admin/customers.html">مشتریان</a>
            <a href="/admin/orders.html">سفارش‌ها</a>
        </aside>
        <main class="admin-content">
            <h1 class="page-title">مدیریت محصولات</h1>
            <div id="alert-box" class="alert"></div>
            <div class="card" style="margin-bottom:1.5rem">
                <h3 id="form-title">افزودن محصول</h3>
                <form onsubmit="saveProduct(event)" style="margin-top:1rem">
                    <input type="hidden" id="prod-id">
                    <div class="form-group"><label>نام</label><input id="prod-name" class="form-control" required></div>
                    <div class="form-group"><label>توضیحات</label><textarea id="prod-desc" class="form-control" rows="2"></textarea></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                        <div class="form-group"><label>قیمت (تومان)</label><input id="prod-price" type="number" class="form-control" required></div>
                        <div class="form-group"><label>موجودی</label><input id="prod-stock" type="number" class="form-control" required></div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                        <div class="form-group"><label>دسته‌بندی</label><select id="prod-category" class="form-control" required></select></div>
                        <div class="form-group"><label>تأمین‌کننده</label><select id="prod-supplier" class="form-control"><option value="">—</option></select></div>
                    </div>
                    <button type="submit" class="btn btn-primary">ذخیره</button>
                    <button type="button" class="btn btn-outline" onclick="resetForm()">انصراف</button>
                </form>
            </div>
            <div class="card">
                <table><thead><tr><th>نام</th><th>قیمت</th><th>موجودی</th><th>دسته</th><th>عملیات</th></tr></thead>
                <tbody id="list"></tbody></table>
            </div>
        </main>
    </div></div>
    <script src="/js/app.js"></script>
    <script>
        let products = [], categories = [], suppliers = [];
        if (!Auth.isAdmin()) location.href = '/login.html';

        document.addEventListener('DOMContentLoaded', async () => {
            categories = await api('/categories');
            suppliers = await api('/suppliers');
            const catSel = document.getElementById('prod-category');
            categories.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; catSel.appendChild(o); });
            const supSel = document.getElementById('prod-supplier');
            suppliers.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; supSel.appendChild(o); });
            loadList();
        });

        async function loadList() {
            const result = await api('/products?pageSize=100');
            products = result.items;
            document.getElementById('list').innerHTML = products.map(p => `
                <tr><td>${p.name}</td><td>${formatPrice(p.price)}</td><td>${p.stock}</td><td>${p.categoryName}</td>
                <td><button class="btn btn-sm btn-outline" onclick="edit(${p.id})">ویرایش</button>
                <button class="btn btn-sm btn-danger" onclick="del(${p.id})">حذف</button></td></tr>`).join('');
        }

        function edit(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-desc').value = p.description || '';
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('prod-category').value = p.categoryId;
            document.getElementById('prod-supplier').value = p.supplierId || '';
            document.getElementById('form-title').textContent = 'ویرایش محصول';
        }

        function resetForm() {
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-desc').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-stock').value = '';
            document.getElementById('form-title').textContent = 'افزودن محصول';
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const supVal = document.getElementById('prod-supplier').value;
            const body = {
                name: document.getElementById('prod-name').value,
                description: document.getElementById('prod-desc').value,
                price: parseFloat(document.getElementById('prod-price').value),
                stock: parseInt(document.getElementById('prod-stock').value),
                categoryId: parseInt(document.getElementById('prod-category').value),
                supplierId: supVal ? parseInt(supVal) : null
            };
            try {
                if (id) await api(`/products/${id}`, { method: 'PUT', body: JSON.stringify(body) });
                else await api('/products', { method: 'POST', body: JSON.stringify(body) });
                resetForm(); loadList(); showAlert('ذخیره شد.', 'success');
            } catch (err) { showAlert(err.message, 'danger'); }
        }

        async function del(id) {
            if (!confirm('حذف شود؟')) return;
            await api(`/products/${id}`, { method: 'DELETE' });
            loadList();
        }
    </script>
</body>
</html>
