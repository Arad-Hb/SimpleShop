<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید | SimpleShop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">SimpleShop</a>
            <div class="nav-links">
                <a href="/">محصولات</a>
                <a href="/orders.html">سفارش‌ها</a>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="container">
            <div id="alert-box" class="alert"></div>
            <h1 class="page-title">سبد خرید</h1>
            <div class="card">
                <table>
                    <thead>
                        <tr><th>محصول</th><th>قیمت</th><th>تعداد</th><th>جمع</th><th></th></tr>
                    </thead>
                    <tbody id="cart-body"></tbody>
                </table>
                <div style="margin-top:1rem;display:flex;justify-content:space-between;align-items:center">
                    <strong id="total"></strong>
                    <button class="btn btn-success" onclick="checkout()">ثبت سفارش</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.isCustomer()) { window.location.href = '/login.html'; return; }
            loadCart();
        });

        async function loadCart() {
            const items = await api('/cart');
            const tbody = document.getElementById('cart-body');
            tbody.innerHTML = '';
            let total = 0;

            if (!items.length) {
                tbody.innerHTML = '<tr><td colspan="5">سبد خرید خالی است.</td></tr>';
                document.getElementById('total').textContent = '';
                return;
            }

            items.forEach(item => {
                total += item.unitPrice * item.quantity;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.productName}</td>
                    <td>${formatPrice(item.unitPrice)}</td>
                    <td>
                        <input type="number" value="${item.quantity}" min="1" max="${item.stock}"
                            style="width:60px" onchange="updateQty(${item.id}, this.value)">
                    </td>
                    <td>${formatPrice(item.unitPrice * item.quantity)}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="removeItem(${item.id})">حذف</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total').textContent = 'جمع کل: ' + formatPrice(total);
        }

        async function updateQty(id, qty) {
            try {
                await api(`/cart/${id}`, { method: 'PUT', body: JSON.stringify({ quantity: parseInt(qty) }) });
                loadCart();
            } catch (e) { showAlert(e.message, 'danger'); }
        }

        async function removeItem(id) {
            await api(`/cart/${id}`, { method: 'DELETE' });
            loadCart();
        }

        async function checkout() {
            try {
                const order = await api('/orders', { method: 'POST', body: JSON.stringify({}) });
                showAlert(`سفارش #${order.id} با موفقیت ثبت شد.`, 'success');
                setTimeout(() => window.location.href = '/orders.html', 1500);
            } catch (e) { showAlert(e.message, 'danger'); }
        }
    </script>
</body>
</html>
