<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل مدیر — پنل مدیریت</title>
  <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="profile">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span data-shop-name>فروشگاه</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link d-lg-none" data-sidebar-toggle aria-label="منو"><i class="bi bi-list fs-4"></i></button>
        <h2 class="header-title">پروفایل مدیر</h2>
      </div>
      <div class="header-actions"><span class="text-muted small" data-admin-name></span></div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav" aria-label="مسیر">
        <ol class="breadcrumb mb-0" data-breadcrumb></ol>
      </nav>

      <div class="page-header">
        <div>
          <h1>پروفایل مدیر</h1>
          <p class="text-muted mb-0 small">ویرایش اطلاعات حساب کاربری</p>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="content-card text-center">
            <div class="card-body">
              <div class="mb-3">
                <img src="" alt="آواتار" id="avatar-preview" class="rounded-circle border"
                     style="width:120px;height:120px;object-fit:cover;display:none">
                <div id="avatar-placeholder" class="rounded-circle border bg-light d-inline-flex align-items-center justify-content-center"
                     style="width:120px;height:120px">
                  <i class="bi bi-person-circle display-4 text-muted"></i>
                </div>
              </div>
              <input type="file" class="form-control form-control-sm mb-2" id="avatar-upload" accept="image/jpeg,image/png,image/webp">
              <button type="button" class="btn btn-sm btn-outline-danger" id="avatar-remove">حذف آواتار</button>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <form id="profile-form" novalidate>
            <div class="content-card mb-4">
              <div class="card-header"><i class="bi bi-person"></i> اطلاعات شخصی</div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="fullName" class="form-label">نام کامل <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                  </div>
                  <div class="col-md-6">
                    <label for="email" class="form-label">ایمیل <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" required>
                  </div>
                  <div class="col-md-6">
                    <label for="mobile" class="form-label">موبایل</label>
                    <input type="text" class="form-control" id="mobile" name="mobile" placeholder="09121234567">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" class="form-control" value="admin" readonly disabled>
                    <div class="form-text">نام کاربری در نسخه دمو قابل تغییر نیست.</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="content-card mb-4">
              <div class="card-header"><i class="bi bi-shield-lock"></i> اطلاعات حساب (فقط نمایش)</div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">نقش</label>
                    <input type="text" class="form-control" value="مدیر سیستم" readonly disabled>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">آخرین ورود</label>
                    <input type="text" class="form-control" id="lastLogin" readonly disabled>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">تاریخ ایجاد حساب</label>
                    <input type="text" class="form-control" id="accountCreated" readonly disabled>
                  </div>
                </div>
              </div>
            </div>

            <div class="content-card mb-4">
              <div class="card-header"><i class="bi bi-key"></i> تغییر رمز عبور</div>
              <div class="card-body">
                <div class="alert alert-info small mb-3">
                  <i class="bi bi-info-circle"></i>
                  در نسخه دمو آفلاین، رمز عبور ثابت است و از طریق API در مرحله بعد قابل تغییر خواهد بود.
                </div>
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">رمز عبور فعلی</label>
                    <input type="password" class="form-control" value="••••••••" readonly disabled>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">رمز عبور جدید</label>
                    <input type="password" class="form-control" placeholder="—" readonly disabled>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">تکرار رمز عبور</label>
                    <input type="password" class="form-control" placeholder="—" readonly disabled>
                  </div>
                </div>
                <button type="button" class="btn btn-secondary mt-3" disabled>تغییر رمز عبور (غیرفعال در دمو)</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> ذخیره پروفایل</button>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" class="toast-container position-fixed bottom-0 start-0 p-3"></div>
<div id="confirm-modal-root"></div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/validation.js"></script>
<script src="assets/js/pagination.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
