<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel|CustomerPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اطلاعات مالی — پنل مشتری</title>
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body data-page="financial">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand customer-sidebar-brand">
      <div class="customer-avatar-wrap">
        <img src="assets/img/customer-avatar.png" alt="" class="customer-avatar" data-customer-avatar>
      </div>
      <span data-customer-brand>مشتری</span>
      <span class="customer-sidebar-chip"><i class="bi bi-stars" aria-hidden="true"></i> حساب من</span>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link sidebar-toggle-btn" data-sidebar-toggle aria-label="منو"><i class="bi bi-layout-sidebar-reverse"></i></button>
        <h2 class="header-title">اطلاعات مالی</h2>
      </div>
      <div class="header-actions">
        <span class="fun-tag fun-tag--lilac me-2">مالی</span>
        <span class="text-muted small" data-customer-name></span>
      </div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav" aria-label="مسیر">
        <ol class="breadcrumb mb-0" data-breadcrumb></ol>
      </nav>

      <div class="settings-page">
        <div class="settings-page__hero">
          <div>
            <h1 class="settings-page__title">
              <span>اطلاعات مالی</span>
              <i class="bi bi-wallet2" aria-hidden="true"></i>
            </h1>
            <p class="settings-page__desc">برای بازگشت وجه یا تسویه، اطلاعات حساب بانکی خود را ثبت کنید</p>
          </div>
        </div>

        <div class="soft-hint mb-3">
          <i class="bi bi-shield-lock"></i>
          <span>این اطلاعات فقط در مرورگر شما (نسخه دمو) ذخیره می‌شود و برای نمایش رابط کاربری است.</span>
        </div>

        <form id="financial-form" novalidate>
          <article class="settings-card">
            <div class="settings-card__body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="accountHolder">صاحب حساب *</label>
                  <input type="text" class="form-control" id="accountHolder" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="bankName">نام بانک</label>
                  <input type="text" class="form-control" id="bankName" placeholder="مثلاً بانک ملت">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="cardNumber">شماره کارت</label>
                  <input type="text" class="form-control" id="cardNumber" placeholder="6037-****-****-1234" dir="ltr" inputmode="numeric">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="sheba">شبا</label>
                  <input type="text" class="form-control" id="sheba" placeholder="IR120170000000123456789001" dir="ltr">
                </div>
              </div>
            </div>
          </article>

          <div class="settings-page__actions">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> ذخیره اطلاعات مالی</button>
            <a href="profile.html" class="btn btn-outline-secondary">بازگشت به پروفایل</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="../AdminPanel/assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/financial.js"></script>
</body>
</html>
