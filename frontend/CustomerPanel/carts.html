<!DOCTYPE html>
<html lang="fa" dir="rtl">

  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel|CustomerPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
  <meta charset="UTF-8">
