<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظرات و امتیازها — پنل مدیریت فروشگاه</title>
  <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="reviews">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span data-shop-name>فروشگاه</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link d-lg-none" data-sidebar-toggle aria-label="منو"><i class="bi bi-list fs-4"></i></button>
        <h2 class="header-title">نظرات و امتیازها</h2>
      </div>
      <div class="header-actions"><span class="text-muted small" data-admin-name></span></div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav" aria-label="مسیر">
        <ol class="breadcrumb mb-0" data-breadcrumb></ol>
      </nav>

      <div class="page-header">
        <div>
          <h1>مدیریت نظرات</h1>
          <p class="text-muted mb-0 small">بررسی، تأیید یا رد نظرات مشتریان</p>
        </div>
        <div class="d-flex flex-wrap gap-2 no-print">
          <button type="button" class="btn btn-success" id="btn-bulk-approve" disabled>
            <i class="bi bi-check-lg"></i> تأیید گروهی
          </button>
          <button type="button" class="btn btn-danger" id="btn-bulk-reject" disabled>
            <i class="bi bi-x-lg"></i> رد گروهی
          </button>
        </div>
      </div>

      <div class="filter-bar no-print">
        <div class="filter-field filter-field--grow">
          <label class="form-label" for="filter-search">جستجو</label>
          <input type="search" class="form-control form-control-sm" id="filter-search" placeholder="عنوان، متن، محصول...">
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-status">وضعیت</label>
          <select class="form-select form-select-sm" id="filter-status">
            <option value="">همه</option>
            <option value="pending">در انتظار</option>
            <option value="approved">تأیید شده</option>
            <option value="rejected">رد شده</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-rating">امتیاز</label>
          <select class="form-select form-select-sm" id="filter-rating">
            <option value="">همه</option>
            <option value="5">۵ ستاره</option>
            <option value="4">۴ ستاره</option>
            <option value="3">۳ ستاره</option>
            <option value="2">۲ ستاره</option>
            <option value="1">۱ ستاره</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-product">محصول</label>
          <select class="form-select form-select-sm" id="filter-product">
            <option value="">همه محصولات</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-customer">مشتری</label>
          <select class="form-select form-select-sm" id="filter-customer">
            <option value="">همه مشتریان</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-date-from">از تاریخ</label>
          <input type="date" class="form-control form-control-sm" id="filter-date-from" data-persian-calendar placeholder="انتخاب تاریخ شمسی">
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-date-to">تا تاریخ</label>
          <input type="date" class="form-control form-control-sm" id="filter-date-to" data-persian-calendar placeholder="انتخاب تاریخ شمسی">
        </div>
        <div class="filter-actions">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-clear-filters">پاک کردن فیلترها</button>
        </div>
      </div>

      <div class="content-card">
        <div class="table-responsive">
          <table class="table admin-table admin-table--reviews mb-0" id="reviews-table">
            <thead>
              <tr>
                <th style="width:40px"><input type="checkbox" class="form-check-input" id="select-all" aria-label="انتخاب همه"></th>
                <th data-sort="productId">محصول</th>
                <th data-sort="customerId">مشتری</th>
                <th data-sort="rating">امتیاز</th>
                <th data-sort="title">عنوان</th>
                <th data-sort="status">وضعیت</th>
                <th data-sort="createdAt">تاریخ</th>
                <th class="no-print">عملیات</th>
              </tr>
            </thead>
            <tbody id="reviews-body"></tbody>
          </table>
        </div>
        <div class="card-body border-top">
          <div class="pagination-wrapper">
            <span class="text-muted small" id="reviews-summary"></span>
            <div id="reviews-pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal جزئیات نظر -->
<div class="modal fade admin-modal" id="review-detail-modal" tabindex="-1" aria-labelledby="reviewDetailTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content admin-modal__content">
      <div class="modal-header">
        <button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="بستن">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
        <h5 class="modal-title" id="reviewDetailTitle">جزئیات نظر</h5>
      </div>
      <div class="modal-body" id="review-detail-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary modal-btn" data-bs-dismiss="modal">بستن</button>
        <button type="button" class="btn btn-success modal-btn" id="modal-approve-btn"><i class="bi bi-check-lg"></i> تأیید</button>
        <button type="button" class="btn btn-danger modal-btn" id="modal-reject-btn"><i class="bi bi-x-lg"></i> رد</button>
        <button type="button" class="btn btn-outline-danger modal-btn" id="modal-delete-btn"><i class="bi bi-trash"></i> حذف</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal رد نظر -->
<div class="modal fade admin-modal" id="reject-reason-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content admin-modal__content">
      <div class="modal-header">
        <button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="بستن">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
        <h5 class="modal-title">دلیل رد نظر</h5>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="reject-reason" class="form-label">دلیل رد <span class="text-danger">*</span></label>
          <textarea class="form-control" id="reject-reason" rows="3" placeholder="دلیل رد نظر را وارد کنید..."></textarea>
        </div>
        <div class="mb-0">
          <label for="admin-note" class="form-label">یادداشت مدیر (اختیاری)</label>
          <textarea class="form-control" id="admin-note" rows="2" placeholder="یادداشت داخلی..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary modal-btn" data-bs-dismiss="modal">انصراف</button>
        <button type="button" class="btn btn-danger modal-btn" id="confirm-reject-btn">رد نظر</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container position-fixed bottom-0 start-0 p-3"></div>
<div id="confirm-modal-root"></div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/persian-datepicker.js"></script>
<script src="assets/js/validation.js"></script>
<script src="assets/js/pagination.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/config.js"></script>
<script src="../shared/vendor/axios.min.js"></script>
<script src="../shared/js/http-client.js"></script>
<script src="assets/js/api-client.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/reviews.js"></script>
</body>
</html>
