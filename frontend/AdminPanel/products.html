<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات — پنل مدیریت فروشگاه</title>
  <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="products">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span data-shop-name>فروشگاه</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link d-lg-none" data-sidebar-toggle aria-label="منو"><i class="bi bi-list fs-4"></i></button>
        <h2 class="header-title">محصولات</h2>
      </div>
      <div class="header-actions"><span class="text-muted small" data-admin-name></span></div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav" aria-label="مسیر">
        <ol class="breadcrumb mb-0" data-breadcrumb></ol>
      </nav>

      <div class="page-header">
        <h1>مدیریت محصولات</h1>
        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-outline-primary" id="btn-resync-api" title="بارگذاری مجدد از دیتابیس">
            <i class="bi bi-cloud-download"></i> همگام با API
          </button>
          <a href="product-gallery.html" class="btn btn-outline-secondary"><i class="bi bi-images"></i> گالری محصولات</a>
          <a href="product-form.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> افزودن محصول</a>
        </div>
      </div>

      <form id="filter-form" class="filter-bar" novalidate>
        <div>
          <label class="form-label" for="filter-search">جست‌وجوی نام</label>
          <input type="search" class="form-control form-control-sm" id="filter-search" name="search" placeholder="نام محصول...">
        </div>
        <div>
          <label class="form-label" for="filter-sku">کد محصول</label>
          <input type="search" class="form-control form-control-sm" id="filter-sku" name="sku" placeholder="SKU...">
        </div>
        <div>
          <label class="form-label" for="filter-category">دسته‌بندی</label>
          <select class="form-select form-select-sm" id="filter-category" name="categoryId">
            <option value="">همه</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-supplier">تأمین‌کننده</label>
          <select class="form-select form-select-sm" id="filter-supplier" name="supplierId">
            <option value="">همه</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-price-min">حداقل قیمت</label>
          <input type="number" class="form-control form-control-sm" id="filter-price-min" name="priceMin" min="0" placeholder="۰">
        </div>
        <div>
          <label class="form-label" for="filter-price-max">حداکثر قیمت</label>
          <input type="number" class="form-control form-control-sm" id="filter-price-max" name="priceMax" min="0" placeholder="—">
        </div>
        <div>
          <label class="form-label" for="filter-stock-min">حداقل موجودی</label>
          <input type="number" class="form-control form-control-sm" id="filter-stock-min" name="stockMin" min="0">
        </div>
        <div>
          <label class="form-label" for="filter-stock-max">حداکثر موجودی</label>
          <input type="number" class="form-control form-control-sm" id="filter-stock-max" name="stockMax" min="0">
        </div>
        <div>
          <label class="form-label" for="filter-stock-status">وضعیت موجودی</label>
          <select class="form-select form-select-sm" id="filter-stock-status" name="stockStatus">
            <option value="">همه</option>
            <option value="available">موجود</option>
            <option value="low">کم‌موجودی</option>
            <option value="out">ناموجود</option>
            <option value="inactive">غیرفعال</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-active">وضعیت انتشار</label>
          <select class="form-select form-select-sm" id="filter-active" name="activeStatus">
            <option value="">همه</option>
            <option value="active">فعال</option>
            <option value="inactive">غیرفعال</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-rating">حداقل امتیاز</label>
          <select class="form-select form-select-sm" id="filter-rating" name="minRating">
            <option value="">همه</option>
            <option value="1">۱+</option>
            <option value="2">۲+</option>
            <option value="3">۳+</option>
            <option value="4">۴+</option>
            <option value="5">۵</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-sort">مرتب‌سازی</label>
          <select class="form-select form-select-sm" id="filter-sort" name="sort">
            <option value="createdAt-desc">جدیدترین</option>
            <option value="createdAt-asc">قدیمی‌ترین</option>
            <option value="name-asc">نام (الف-ی)</option>
            <option value="name-desc">نام (ی-الف)</option>
            <option value="price-asc">قیمت (کم به زیاد)</option>
            <option value="price-desc">قیمت (زیاد به کم)</option>
            <option value="stock-asc">موجودی (کم به زیاد)</option>
            <option value="stock-desc">موجودی (زیاد به کم)</option>
            <option value="rating-desc">امتیاز (بیشترین)</option>
            <option value="rating-asc">امتیاز (کمترین)</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-page-size">تعداد در صفحه</label>
          <select class="form-select form-select-sm" id="filter-page-size" name="pageSize">
            <option value="10">۱۰</option>
            <option value="20">۲۰</option>
            <option value="50">۵۰</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> اعمال</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-clear-filters">پاک‌کردن</button>
        </div>
      </form>

      <div class="content-card">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
          <span>فهرست محصولات</span>
          <span class="text-muted small" id="results-count"></span>
        </div>
        <div class="card-body p-0 position-relative" id="table-container">
          <div class="table-responsive">
            <table class="table admin-table admin-table--products mb-0">
              <thead>
                <tr>
                  <th class="col-img">تصویر</th>
                  <th class="col-id" data-sort="id">شناسه</th>
                  <th class="col-sku" data-sort="sku">کد</th>
                  <th class="col-name" data-sort="name">نام</th>
                  <th class="col-cat">دسته‌بندی</th>
                  <th class="col-supplier">تأمین‌کننده</th>
                  <th class="col-price" data-sort="price">قیمت</th>
                  <th class="col-stock" data-sort="stock">موجودی</th>
                  <th class="col-min">حداقل</th>
                  <th class="col-stock-status">وضعیت موجودی</th>
                  <th class="col-publish">انتشار</th>
                  <th class="col-actions">عملیات</th>
                </tr>
              </thead>
              <tbody id="products-tbody"></tbody>
            </table>
          </div>
        </div>
        <div class="card-body border-top">
          <div class="pagination-wrapper">
            <div id="pagination-info" class="text-muted small"></div>
            <div id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-container" class="toast-container position-fixed bottom-0 start-0 p-3"></div>
<div id="confirm-modal-root"></div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/validation.js"></script>
<script src="assets/js/pagination.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api-client.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/products.js"></script>
</body>
</html>
