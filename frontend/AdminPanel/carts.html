<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبدهای خرید — پنل مدیریت فروشگاه</title>
  <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="carts">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand"><i class="bi bi-shop"></i><span data-shop-name>فروشگاه ساده تحلیل داده</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link d-lg-none" data-sidebar-toggle aria-label="منو"><i class="bi bi-list fs-4"></i></button>
        <h2 class="header-title">سبدهای خرید</h2>
      </div>
      <div class="header-actions"><span class="text-muted small" data-admin-name></span></div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav" aria-label="مسیر">
        <ol class="breadcrumb mb-0" data-breadcrumb></ol>
      </nav>

      <div class="page-header">
        <h1>مدیریت سبدهای خرید</h1>
      </div>

      <form id="filter-form" class="filter-bar">
        <div class="filter-field filter-field--grow">
          <label class="form-label" for="filter-customer">مشتری</label>
          <input type="search" class="form-control form-control-sm" id="filter-customer" name="customerQuery" placeholder="نام، نام‌خانوادگی، موبایل یا شناسه" autocomplete="off">
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-status">وضعیت</label>
          <select class="form-select form-select-sm" id="filter-status" name="status">
            <option value="">همه</option>
            <option value="active">فعال</option>
            <option value="converted">تبدیل‌شده</option>
            <option value="abandoned">رها شده</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-dateFrom">از تاریخ</label>
          <input type="date" class="form-control form-control-sm" id="filter-dateFrom" name="dateFrom" data-persian-calendar placeholder="انتخاب تاریخ شمسی" title="نمایش شمسی؛ فیلتر با تاریخ میلادی انجام می‌شود">
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-dateTo">تا تاریخ</label>
          <input type="date" class="form-control form-control-sm" id="filter-dateTo" name="dateTo" data-persian-calendar placeholder="انتخاب تاریخ شمسی" title="نمایش شمسی؛ فیلتر با تاریخ میلادی انجام می‌شود">
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-itemCount">تعداد آیتم سبد</label>
          <select class="form-select form-select-sm" id="filter-itemCount" name="itemCount">
            <option value="">همه</option>
            <option value="0">۰ آیتم (خالی)</option>
            <option value="1">۱ آیتم</option>
            <option value="2">۲ آیتم</option>
            <option value="3">۳ آیتم</option>
            <option value="4">۴ آیتم</option>
            <option value="5plus">۵ آیتم و بیشتر</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> اعمال</button>
          <button type="reset" class="btn btn-outline-secondary btn-sm" id="reset-filters">پاک کردن</button>
        </div>
      </form>

      <div class="content-card">
        <div class="table-responsive">
          <table class="table admin-table admin-table--carts mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>مشتری</th>
                <th>تعداد آیتم</th>
                <th>مبلغ تقریبی</th>
                <th>وضعیت</th>
                <th>آخرین بروزرسانی</th>
                <th>عملیات</th>
              </tr>
            </thead>
            <tbody id="carts-body"></tbody>
          </table>
        </div>
        <div class="card-body border-top">
          <div class="pagination-wrapper">
            <span class="text-muted small" id="pagination-info"></span>
            <div id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade admin-modal" id="cart-detail-modal" tabindex="-1" aria-labelledby="cart-detail-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content admin-modal__content">
      <div class="modal-header">
        <button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="بستن">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
        <h5 class="modal-title" id="cart-detail-title">جزئیات سبد خرید</h5>
      </div>
      <div class="modal-body" id="cart-detail-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary modal-btn" data-bs-dismiss="modal">بستن</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container position-fixed bottom-0 start-0 p-3"></div>
<div id="confirm-modal-root"></div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/persian-datepicker.js"></script>
<script src="assets/js/validation.js"></script>
<script src="assets/js/pagination.js"></script>
<script src="../shared/js/sidebar-brand.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/config.js"></script>
<script src="../shared/vendor/axios.min.js"></script>
<script src="../shared/js/http-client.js"></script>
<script src="assets/js/api-client.js"></script>
<script src="../shared/js/offline-data.js"></script>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/carts.js"></script>
</body>
</html>
