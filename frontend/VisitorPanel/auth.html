<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام — TahlilDadeh Simple Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <div id="store-header"></div>
  <main class="page-shell">
    <div class="container-xxl">
      <div class="auth-wrap panel-card">
        <div class="text-center mb-3">
          <span class="brand-mark d-inline-flex"><i class="bi bi-person-circle"></i></span>
          <h1 class="h4 fw-bold mt-3 mb-1">حساب کاربری</h1>
          <p class="text-muted small mb-0">ورود یا ثبت‌نام در فروشگاه</p>
        </div>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true">
            <i class="bi bi-box-arrow-in-left"></i> ورود
          </button>
          <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false">
            <i class="bi bi-person-plus"></i> ثبت‌نام
          </button>
        </div>

        <div id="auth-error" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <!-- Login -->
        <div id="auth-pane-login" class="auth-pane" data-auth-pane="login">
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="login-mobile">موبایل</label>
              <input type="tel" class="form-control" id="login-mobile" name="mobile"
                     placeholder="09121234567" dir="ltr" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="login-password">رمز عبور</label>
              <input type="password" class="form-control" id="login-password" name="password"
                     autocomplete="current-password" required>
            </div>
            <input type="hidden" id="login-role" name="role" value="Customer">
            <button type="submit" class="btn btn-primary w-100 mb-2">ورود</button>
            <p class="text-center small text-muted mb-0">
              فروشنده هستید؟
              <button type="button" class="btn btn-link btn-sm p-0 align-baseline" id="login-as-supplier">
                ورود با حساب فروشنده
              </button>
            </p>
          </form>
        </div>

        <!-- Register -->
        <div id="auth-pane-register" class="auth-pane d-none" data-auth-pane="register">
          <div class="role-switch mb-3" role="group" aria-label="نوع حساب">
            <button type="button" class="role-switch-btn active" data-role="Customer">
              <i class="bi bi-person"></i> مشتری
            </button>
            <button type="button" class="role-switch-btn" data-role="Supplier">
              <i class="bi bi-shop"></i> فروشنده
            </button>
          </div>

          <form id="register-form" novalidate>
            <input type="hidden" id="register-role" name="role" value="Customer">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="register-firstName">نام</label>
                <input type="text" class="form-control" id="register-firstName" name="firstName" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="register-lastName">نام خانوادگی</label>
                <input type="text" class="form-control" id="register-lastName" name="lastName" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="register-mobile">موبایل</label>
              <input type="tel" class="form-control" id="register-mobile" name="mobile"
                     placeholder="09121234567" dir="ltr" autocomplete="tel" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="register-password">رمز عبور</label>
              <input type="password" class="form-control" id="register-password" name="password"
                     autocomplete="new-password" minlength="6" required>
              <div class="form-text">حداقل ۶ کاراکتر</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
          </form>
        </div>

        <a href="index.html" class="btn btn-outline-secondary w-100 mt-3">بازگشت به فروشگاه</a>
      </div>
    </div>
  </main>
  <div id="store-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="../shared/vendor/axios.min.js"></script>
  <script src="../shared/js/http-client.js"></script>
  <script src="../shared/js/auth-api.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/store-core.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
