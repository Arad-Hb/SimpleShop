<!DOCTYPE html>
<html lang="fa" dir="rtl" class="login-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام — فروشگاه ساده تحلیل داده</title>
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/login.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-avatar" aria-hidden="true">
        <img src="../shared/assets/img/tahlildadeh-logo.png" alt="فروشگاه ساده تحلیل داده">
      </div>

      <div class="login-title">
        <h1>حساب کاربری فروشگاه</h1>
        <p>ورود یا ثبت‌نام در فروشگاه ساده تحلیل داده</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true">
          <i class="bi bi-box-arrow-in-left"></i> ورود
        </button>
        <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false">
          <i class="bi bi-person-plus"></i> ثبت‌نام
        </button>
      </div>

      <div id="auth-hint" class="alert alert-info d-none py-2 small" role="status"></div>
      <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login -->
      <div id="auth-pane-login" class="auth-pane" data-auth-pane="login">
        <form id="login-form" novalidate>
          <div class="login-field-group mb-3">
            <div class="login-field">
              <span class="login-field__icon"><i class="bi bi-phone-fill" aria-hidden="true"></i></span>
              <input type="tel" id="login-mobile" name="mobile"
                     placeholder="شماره موبایل" dir="ltr" autocomplete="username" inputmode="numeric" required>
            </div>
          </div>

          <div class="login-field-group mb-3">
            <div class="login-field">
              <span class="login-field__icon"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
              <input type="password" id="login-password" name="password"
                     autocomplete="current-password" placeholder="رمز عبور" required>
              <button type="button" class="login-field__eye" id="toggle-login-password"
                      aria-label="نمایش رمز عبور" aria-pressed="false">
                <i class="bi bi-eye-fill" id="toggle-login-password-icon" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <input type="hidden" id="login-role" name="role" value="Customer">

          <button type="submit" class="login-btn" id="login-submit">
            <span class="submit-text">ورود</span>
            <span class="submit-loading d-none">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              در حال ورود...
            </span>
          </button>

          <p class="auth-supplier-link">
            فروشنده هستید؟
            <button type="button" id="login-as-supplier">ورود با حساب فروشنده</button>
          </p>
        </form>
      </div>

      <!-- Register -->
      <div id="auth-pane-register" class="auth-pane d-none" data-auth-pane="register">
        <div class="role-switch" role="group" aria-label="نوع حساب">
          <button type="button" class="role-switch-btn active" data-role="Customer">
            <i class="bi bi-person"></i> مشتری
          </button>
          <button type="button" class="role-switch-btn" data-role="Supplier">
            <i class="bi bi-shop"></i> فروشنده
          </button>
        </div>

        <form id="register-form" class="auth-register-form" novalidate>
          <input type="hidden" id="register-role" name="role" value="Customer">

          <div class="login-field-group">
            <div class="login-field">
              <span class="login-field__icon"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
              <input type="text" id="register-firstName" name="firstName" placeholder="نام" autocomplete="given-name" required>
            </div>
          </div>

          <div class="login-field-group">
            <div class="login-field">
              <span class="login-field__icon"><i class="bi bi-person-badge-fill" aria-hidden="true"></i></span>
              <input type="text" id="register-lastName" name="lastName" placeholder="نام خانوادگی" autocomplete="family-name" required>
            </div>
          </div>

          <div class="login-field-group">
            <div class="login-field">
              <span class="login-field__icon"><i class="bi bi-phone-fill" aria-hidden="true"></i></span>
              <input type="tel" id="register-mobile" name="mobile"
                     placeholder="شماره موبایل" dir="ltr" autocomplete="tel" inputmode="numeric" required>
            </div>
          </div>

          <div class="login-field-group login-field-group--hint">
            <div class="login-field">
              <span class="login-field__icon"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
              <input type="password" id="register-password" name="password"
                     autocomplete="new-password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" minlength="6" required>
              <button type="button" class="login-field__eye" id="toggle-register-password"
                      aria-label="نمایش رمز عبور" aria-pressed="false">
                <i class="bi bi-eye-fill" id="toggle-register-password-icon" aria-hidden="true"></i>
              </button>
            </div>
            <p class="auth-field-hint">حداقل ۶ کاراکتر</p>
          </div>

          <button type="submit" class="login-btn auth-register-submit" id="register-submit">
            <span class="submit-text">ثبت‌نام</span>
            <span class="submit-loading d-none">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              در حال ثبت‌نام...
            </span>
          </button>
        </form>
      </div>

      <div class="demo-hint">
        <strong>حساب‌های دمو:</strong>
        مشتری <code>09121000001</code> / <code>Customer123!</code>
        — فروشنده <code>09122000001</code> / <code>Supplier123!</code>
      </div>

      <a href="index.html" class="auth-back">بازگشت به فروشگاه</a>
      <div class="login-academy">فروشگاه ساده تحلیل داده</div>
    </div>
  </div>

  <script src="../AdminPanel/assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="../shared/vendor/axios.min.js"></script>
  <script src="../shared/js/http-client.js"></script>
  <script src="../shared/js/auth-api.js"></script>
  <script src="../shared/js/panel-session.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
