<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام — فروشگاه ساده تحلیل داده</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <div id="store-header"></div>
  <main class="page-shell">
    <div class="container-xxl py-5" style="max-width:480px">
      <h1>ثبت‌نام مشتری</h1>
      <form id="register-form">
        <div class="mb-3"><label class="form-label">نام</label><input class="form-control" name="firstName" required></div>
        <div class="mb-3"><label class="form-label">نام خانوادگی</label><input class="form-control" name="lastName" required></div>
        <div class="mb-3"><label class="form-label">موبایل</label><input class="form-control" name="mobileNumber" required placeholder="0912xxxxxxx"></div>
        <div class="mb-3"><label class="form-label">رمز عبور</label><input class="form-control" type="password" name="password" required minlength="6"></div>
        <button class="btn btn-primary w-100" type="submit">ثبت‌نام</button>
      </form>
      <p class="mt-3">حساب دارید؟ <a href="login.html">ورود</a></p>
    </div>
  </main>
  <div id="store-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/vendor/axios.min.js"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/cart.js"></script>
  <script src="../shared/js/common.js"></script>
  <script src="../shared/js/toast.js"></script>
  <script src="../shared/js/layout.js"></script>
  <script src="../shared/js/pages/register.js"></script>
</body>
</html>
