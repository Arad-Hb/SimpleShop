<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود — فروشگاه ساده تحلیل داده</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <div id="store-header"></div>
  <main class="page-shell">
    <div class="container-xxl py-5" style="max-width:480px">
      <h1>ورود</h1>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">شماره موبایل</label>
          <input class="form-control" name="mobileNumber" required placeholder="09120000002">
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <label class="mb-3"><input type="checkbox" name="rememberMe"> مرا به خاطر بسپار</label>
        <button class="btn btn-primary w-100" type="submit">ورود</button>
      </form>
      <p class="mt-3">حساب ندارید؟ <a href="register.html">ثبت‌نام</a></p>
    </div>
  </main>
  <div id="store-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/vendor/axios.min.js"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/cart.js"></script>
  <script src="../shared/js/common.js"></script>
  <script src="../shared/js/toast.js"></script>
  <script src="../shared/js/layout.js"></script>
  <script src="../shared/js/pages/login.js"></script>
</body>
</html>
