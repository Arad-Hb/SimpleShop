<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود — SimpleShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <div id="store-header"></div>
  <main class="page-shell">
    <div class="container-xxl">
      <div class="auth-wrap panel-card">
        <div class="text-center mb-4">
          <span class="brand-mark d-inline-flex"><i class="bi bi-person"></i></span>
          <h1 class="h4 fw-bold mt-3 mb-1">ورود به حساب کاربری</h1>
          <p class="text-muted small mb-0">ورود دمو برای پیش‌نمایش فروشگاه</p>
        </div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="email">نام کاربری</label>
            <input type="text" class="form-control" id="email" placeholder="customer یا admin" required>
            <div class="form-text">API: customer / Customer123!</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">رمز عبور</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">ورود</button>
          <a href="index.html" class="btn btn-outline-secondary w-100">بازگشت به فروشگاه</a>
        </form>
      </div>
    </div>
  </main>
  <div id="store-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="../shared/vendor/axios.min.js"></script>
<script src="../shared/js/http-client.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/store-core.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login-page.js"></script>
</body>
</html>
