<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleShop — ورود به پنل‌ها</title>
  <link rel="stylesheet" href="AdminPanel/assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="AdminPanel/assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="AdminPanel/assets/css/login.css">
  <style>
    .portal-wrap {
      width: min(100%, 420px);
      display: grid;
      gap: 0.85rem;
    }
    .portal-card {
      background: linear-gradient(165deg, rgba(255,255,255,0.78), rgba(240,244,252,0.52));
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(12, 20, 48, 0.1);
      backdrop-filter: blur(16px);
      padding: 1.5rem 1.35rem;
      text-align: center;
    }
    .portal-card h1 {
      margin: 0 0 0.4rem;
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f1830;
    }
    .portal-card p {
      margin: 0 0 1.1rem;
      color: #3a455c;
      font-size: 0.88rem;
      line-height: 1.7;
    }
    .portal-card a.login-btn {
      display: block;
      text-decoration: none;
      margin-bottom: 0.65rem;
    }
    .portal-card a.login-btn:last-child { margin-bottom: 0; }
    .portal-card a.login-btn.is-outline {
      background: transparent !important;
      color: #152363 !important;
      border: 2px solid #2b9bff;
      box-shadow: none;
    }
    .portal-card a.login-btn.is-outline:hover {
      background: rgba(43, 155, 255, 0.1) !important;
    }
    body.login-page .login-btn:not(.is-outline) {
      background: #152363 !important;
    }
    .portal-hint {
      margin-top: 0.85rem;
      font-size: 0.78rem;
      color: #2f3a50;
      line-height: 1.65;
    }
  </style>
</head>
<body class="login-page">
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="login-avatar" style="position:relative;transform:none;left:auto;margin:0 auto 1rem;">
        <img src="shared/assets/img/tahlildadeh-logo.png" alt="Tahlildadeh Academy">
      </div>
      <h1>SimpleShop</h1>
      <p>برای دیدن فرم ورود، یکی از پنل‌ها را انتخاب کنید. باز کردن پوشه به‌تنهایی فقط فهرست فایل‌ها را نشان می‌دهد.</p>
      <a class="login-btn" href="AdminPanel/login.html">ورود پنل مدیریت</a>
      <a class="login-btn is-outline" href="SupplierPanel/login.html">ورود پنل تأمین‌کننده</a>
      <a class="login-btn is-outline" href="CustomerPanel/login.html">ورود پنل مشتری</a>
      <div class="portal-hint">
        مسیر درست: فایل <code>login.html</code> داخل هر پنل — نه خودِ پوشه.
      </div>
      <div class="login-academy" style="margin-top:1rem;">Tahlildadeh Academy</div>
    </div>
  </div>
</body>
</html>
