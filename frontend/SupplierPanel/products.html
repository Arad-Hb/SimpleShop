<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات من — پنل تأمین‌کننده</title>
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/supplier.css">
</head>
<body data-page="products">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand"><i class="bi bi-truck"></i><span data-company-name>تأمین‌کننده</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
  <script>
(function () {
  var path = location.pathname || '';
  if (/\/(AdminPanel|SupplierPanel)$/i.test(path)) {
    location.replace(path + '/' + location.search + location.hash);
  }
})();
</script>
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link sidebar-toggle-btn" data-sidebar-toggle aria-label="منو"><i class="bi bi-layout-sidebar-reverse"></i></button>
        <h2 class="header-title">محصولات من</h2>
      </div>
      <div class="header-actions"><span class="text-muted small" data-supplier-name></span></div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav" aria-label="مسیر">
        <ol class="breadcrumb mb-0" data-breadcrumb></ol>
      </nav>

      <div class="page-header">
        <div>
          <h1>محصولات من</h1>
          <p class="text-muted mb-0 small">افزودن، ویرایش و تنظیم موجودی</p>
        </div>
        <a href="product-form.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> محصول جدید</a>
      </div>

      <form id="filter-form" class="filter-bar">
        <div class="filter-field">
          <label class="form-label" for="search">جستجو</label>
          <input type="search" id="search" class="form-control form-control-sm" placeholder="نام، کد کالا، برند...">
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-brand">برند</label>
          <select id="filter-brand" class="form-select form-select-sm"></select>
        </div>
        <div class="filter-field">
          <label class="form-label" for="filter-status">وضعیت</label>
          <select id="filter-status" class="form-select form-select-sm">
            <option value="">همه</option>
            <option value="active">فعال</option>
            <option value="inactive">غیرفعال</option>
            <option value="low">کم‌موجود</option>
            <option value="out">ناموجود</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> اعمال</button>
        <button type="button" id="btn-reset" class="btn btn-outline-secondary btn-sm">پاک کردن</button>
      </form>

      <div class="content-card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table admin-table admin-table--products mb-0">
              <thead>
                <tr>
                  <th>محصول</th>
                  <th>برند</th>
                  <th>قیمت</th>
                  <th>موجودی</th>
                  <th>وضعیت انبار</th>
                  <th>فعال</th>
                  <th class="col-actions">عملیات</th>
                </tr>
              </thead>
              <tbody id="products-body"></tbody>
            </table>
          </div>
          <div id="products-empty" class="empty-state d-none">
            <i class="bi bi-box"></i>
            <p>محصولی یافت نشد.</p>
            <a href="product-form.html" class="btn btn-primary btn-sm">افزودن اولین محصول</a>
          </div>
          <div class="pagination-wrapper px-3">
            <span class="text-muted small" id="pagination-info"></span>
            <div id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="confirm-modal-root"></div>

<script src="../AdminPanel/assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/products.js"></script>
</body>
</html>
