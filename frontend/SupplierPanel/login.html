<!DOCTYPE html>
<html lang="fa" dir="rtl" class="login-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود — پنل تأمین‌کننده</title>
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/admin.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/login.css">
  <link rel="stylesheet" href="assets/css/supplier.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-avatar" aria-hidden="true">
        <img src="assets/img/tahlildadeh-logo.png" alt="فروشگاه ساده تحلیل داده">
      </div>

      <div class="login-title">
        <h1>پنل تأمین‌کننده</h1>
        <p>برای مدیریت محصولات و موجودی وارد شوید</p>
      </div>

      <form id="login-form" novalidate>
        <div class="login-field-group mb-3">
          <div class="login-field">
            <span class="login-field__icon"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
            <input type="text" id="username" name="username"
                   autocomplete="username" inputmode="numeric" placeholder="شماره موبایل" required>
          </div>
        </div>

        <div class="login-field-group mb-3">
          <div class="login-field">
            <span class="login-field__icon"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" placeholder="رمز عبور" required>
            <button type="button" class="login-field__eye" id="toggle-password"
                    aria-label="نمایش رمز عبور" aria-pressed="false">
              <i class="bi bi-eye-fill" id="toggle-password-icon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="login-meta">
          <label class="login-remember" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span>مرا به خاطر بسپار</span>
          </label>
          <a class="login-forgot" href="#">رمز عبور را فراموش کردید؟</a>
        </div>

        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <button type="submit" class="login-btn" id="login-submit">ورود به پنل</button>
      </form>

      <div class="demo-hint">
        <strong>حساب دمو:</strong>
        موبایل <code>09122000001</code> — رمز عبور <code>Supplier123!</code>
      </div>
      <div class="login-academy">فروشگاه ساده تحلیل داده</div>
    </div>
  </div>

  <script src="../AdminPanel/assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="../shared/js/sidebar-brand.js"></script>
<script src="assets/js/ui.js"></script>
  <script src="../shared/js/api-config.js"></script>
  <script src="../shared/vendor/axios.min.js"></script>
<script src="../shared/js/http-client.js"></script>
  <script src="../shared/js/auth-api.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/seed-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
