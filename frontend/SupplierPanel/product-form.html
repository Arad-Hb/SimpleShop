<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم محصول — پنل تأمین‌کننده</title>
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../AdminPanel/assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/supplier.css">
</head>
<body data-page="products">
<div class="admin-wrapper">
  <aside id="sidebar" class="admin-sidebar" data-sidebar>
    <div class="sidebar-brand"><i class="bi bi-truck"></i><span data-company-name>تأمین‌کننده</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" data-action="logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-link d-lg-none" data-sidebar-toggle aria-label="منو"><i class="bi bi-list fs-4"></i></button>
        <h2 class="header-title" id="form-title">محصول</h2>
      </div>
      <div class="header-actions"><span class="text-muted small" data-supplier-name></span></div>
    </header>
    <main class="admin-content">
      <nav class="breadcrumb-nav"><ol class="breadcrumb mb-0" data-breadcrumb></ol></nav>

      <div class="content-card">
        <div class="card-header" id="form-title-header">اطلاعات محصول</div>
        <div class="card-body">
          <form id="product-form" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="name">نام محصول *</label>
                <input type="text" class="form-control" id="name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="sku">کد کالا (SKU)</label>
                <input type="text" class="form-control" id="sku">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="brandId">برند *</label>
                <select class="form-select" id="brandId" required></select>
                <div class="form-text"><a href="brands.html">مدیریت برندها</a></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="price">قیمت (تومان) *</label>
                <input type="number" class="form-control" id="price" min="0" step="1000" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="stock">موجودی فعلی *</label>
                <input type="number" class="form-control" id="stock" min="0" value="0" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="lowStockThreshold">آستانه کم‌موجودی</label>
                <input type="number" class="form-control" id="lowStockThreshold" min="0" value="5">
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="isActive" checked>
                  <label class="form-check-label" for="isActive">محصول فعال باشد</label>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="description">توضیحات</label>
                <textarea class="form-control" id="description" rows="4"></textarea>
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> ذخیره</button>
              <a href="products.html" class="btn btn-outline-secondary">انصراف</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../AdminPanel/assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/product-form.js"></script>
</body>
</html>
