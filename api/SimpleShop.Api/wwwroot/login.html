<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | SimpleShop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">SimpleShop</a>
            <div class="nav-links"><a href="/">بازگشت به فروشگاه</a></div>
        </div>
    </nav>

    <div class="page">
        <div class="container">
            <div class="card auth-box">
                <h2 style="margin-bottom:1.5rem;text-align:center">ورود به حساب</h2>
                <div id="alert-box" class="alert"></div>
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label>نام کاربری</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>رمز عبور</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">ورود</button>
                </form>
                <p style="text-align:center;margin-top:1rem">
                    حساب ندارید؟ <a href="/register.html">ثبت‌نام</a>
                </p>
                <div style="margin-top:1.5rem;padding:1rem;background:var(--bg);border-radius:var(--radius);font-size:.85rem">
                    <strong>حساب‌های آزمایشی:</strong><br>
                    مدیر: admin / Admin123!<br>
                    مشتری: customer / Customer123!
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        async function login(e) {
            e.preventDefault();
            try {
                const data = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                Auth.save(data.token, {
                    username: data.username,
                    role: data.role,
                    fullName: data.fullName,
                    customerId: data.customerId
                });
                window.location.href = data.role === 'Admin' ? '/admin/' : '/';
            } catch (err) {
                showAlert(err.message, 'danger');
            }
        }
    </script>
</body>
</html>
