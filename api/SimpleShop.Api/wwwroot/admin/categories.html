<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دسته‌بندی‌ها | پنل مدیریت</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar"><div class="container"><a href="/" class="logo">SimpleShop</a><div class="nav-links"><a href="/admin/">بازگشت</a></div></div></nav>
    <div class="page"><div class="container admin-layout">
        <aside class="admin-sidebar card">
            <a href="/admin/">داشبورد</a>
            <a href="/admin/categories.html" class="active">دسته‌بندی‌ها</a>
            <a href="/admin/products.html">محصولات</a>
            <a href="/admin/suppliers.html">تأمین‌کنندگان</a>
            <a href="/admin/customers.html">مشتریان</a>
            <a href="/admin/orders.html">سفارش‌ها</a>
        </aside>
        <main class="admin-content">
            <h1 class="page-title">مدیریت دسته‌بندی‌ها</h1>
            <div id="alert-box" class="alert"></div>
            <div class="card" style="margin-bottom:1.5rem">
                <h3 id="form-title">افزودن دسته‌بندی</h3>
                <form onsubmit="saveCategory(event)" style="margin-top:1rem">
                    <input type="hidden" id="cat-id">
                    <div class="form-group"><label>نام</label><input id="cat-name" class="form-control" required></div>
                    <div class="form-group"><label>توضیحات</label><input id="cat-desc" class="form-control"></div>
                    <button type="submit" class="btn btn-primary">ذخیره</button>
                    <button type="button" class="btn btn-outline" onclick="resetForm()">انصراف</button>
                </form>
            </div>
            <div class="card">
                <table><thead><tr><th>نام</th><th>توضیحات</th><th>تعداد محصول</th><th>عملیات</th></tr></thead>
                <tbody id="list"></tbody></table>
            </div>
        </main>
    </div></div>
    <script src="/js/app.js"></script>
    <script>
        if (!Auth.isAdmin()) location.href = '/login.html';
        document.addEventListener('DOMContentLoaded', loadList);

        async function loadList() {
            const items = await api('/categories');
            document.getElementById('list').innerHTML = items.map(c => `
                <tr><td>${c.name}</td><td>${c.description||''}</td><td>${c.productCount}</td>
                <td><button class="btn btn-sm btn-outline" onclick="edit(${c.id},'${c.name.replace(/'/g,"\\'")}','${(c.description||'').replace(/'/g,"\\'")}')">ویرایش</button>
                <button class="btn btn-sm btn-danger" onclick="del(${c.id})">حذف</button></td></tr>`).join('');
        }

        function edit(id, name, desc) {
            document.getElementById('cat-id').value = id;
            document.getElementById('cat-name').value = name;
            document.getElementById('cat-desc').value = desc;
            document.getElementById('form-title').textContent = 'ویرایش دسته‌بندی';
        }

        function resetForm() {
            document.getElementById('cat-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-desc').value = '';
            document.getElementById('form-title').textContent = 'افزودن دسته‌بندی';
        }

        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('cat-id').value;
            const body = { name: document.getElementById('cat-name').value, description: document.getElementById('cat-desc').value };
            try {
                if (id) await api(`/categories/${id}`, { method: 'PUT', body: JSON.stringify(body) });
                else await api('/categories', { method: 'POST', body: JSON.stringify(body) });
                resetForm(); loadList(); showAlert('ذخیره شد.', 'success');
            } catch (err) { showAlert(err.message, 'danger'); }
        }

        async function del(id) {
            if (!confirm('حذف شود؟')) return;
            try { await api(`/categories/${id}`, { method: 'DELETE' }); loadList(); }
            catch (e) { showAlert(e.message, 'danger'); }
        }
    </script>
</body>
</html>
