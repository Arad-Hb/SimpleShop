<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفارش‌ها | پنل مدیریت</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar"><div class="container"><a href="/" class="logo">SimpleShop</a><div class="nav-links"><a href="/admin/">بازگشت</a></div></div></nav>
    <div class="page"><div class="container admin-layout">
        <aside class="admin-sidebar card">
            <a href="/admin/">داشبورد</a>
            <a href="/admin/categories.html">دسته‌بندی‌ها</a>
            <a href="/admin/products.html">محصولات</a>
            <a href="/admin/suppliers.html">تأمین‌کنندگان</a>
            <a href="/admin/customers.html">مشتریان</a>
            <a href="/admin/orders.html" class="active">سفارش‌ها</a>
        </aside>
        <main class="admin-content">
            <h1 class="page-title">مدیریت سفارش‌ها</h1>
            <div id="orders"></div>
        </main>
    </div></div>
    <script src="/js/app.js"></script>
    <script>
        if (!Auth.isAdmin()) location.href = '/login.html';
        document.addEventListener('DOMContentLoaded', loadOrders);

        async function loadOrders() {
            const orders = await api('/orders');
            document.getElementById('orders').innerHTML = orders.length ? orders.map(o => `
                <div class="card" style="margin-bottom:1rem">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
                        <div><strong>#${o.id}</strong> — ${o.customerName} — ${formatDate(o.orderDate)}</div>
                        <div>
                            <select onchange="updateStatus(${o.id}, this.value)" class="form-control" style="width:auto;display:inline">
                                ${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s =>
                                    `<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <p>مبلغ: <strong>${formatPrice(o.totalAmount)}</strong> | آدرس: ${o.shippingAddress||'—'}</p>
                    <table style="margin-top:.5rem"><thead><tr><th>محصول</th><th>تعداد</th><th>قیمت</th></tr></thead>
                    <tbody>${o.items.map(i=>`<tr><td>${i.productName}</td><td>${i.quantity}</td><td>${formatPrice(i.unitPrice)}</td></tr>`).join('')}</tbody></table>
                </div>`).join('') : '<div class="card"><p>سفارشی ثبت نشده.</p></div>';
        }

        async function updateStatus(id, status) {
            await api(`/orders/${id}/status`, { method: 'PUT', body: JSON.stringify(status) });
        }
    </script>
</body>
</html>
